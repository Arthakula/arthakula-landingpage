name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Find associated PR
        id: pr
        run: |
          RESPONSE=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls")
          PR_NUMBER=$(echo "$RESPONSE" | jq -r '.[0].number // ""')
          PR_TITLE=$(echo "$RESPONSE" | jq -r '.[0].title // ""')
          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "title=$PR_TITLE" >> $GITHUB_OUTPUT

      - name: Create Release
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists — skipping"
            exit 0
          fi

          if [ -n "$PR_NUMBER" ]; then
            TITLE="$TAG (PR #$PR_NUMBER)"
            BODY=$(cat <<EOF
          ## PR #${PR_NUMBER} — ${PR_TITLE}

          ${IMAGE}:$TAG

          | | |
          |---|---|
          | **PR** | [#${PR_NUMBER}](https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}) |
          | **Commit** | [\`${GITHUB_SHA::7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |
          | **Image** | \`${IMAGE}:$TAG\` |

          Rollback ke versi ini di server:
          \`\`\`bash
          docker compose pull && docker compose up -d
          \`\`\`
          EOF
          )
          else
            TITLE="$TAG"
            BODY=$(cat <<EOF
          ## Direct push (tanpa PR)

          ${IMAGE}:$TAG

          | | |
          |---|---|
          | **Commit** | [\`${GITHUB_SHA::7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |
          | **Image** | \`${IMAGE}:$TAG\` |
          EOF
          )
          fi

          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes "$BODY"
